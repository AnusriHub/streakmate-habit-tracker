<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - StreakMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <!-- Brand -->
        <div class="text-center mb-4">
            <a href="/" class="sm-brand text-decoration-none">
                <span class="sm-brand-name">StreakMate</span>
            </a>

            <p class="mt-2 mb-0 text-muted">
                Track your habits and keep your streak going.
            </p>
        </div>


        <!-- Login heading -->
        <div class="mb-4">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">
                Sign in using your email or username.
            </p>
        </div>


        <!-- Error message -->
        <div th:if="${errorMessage}"
             class="sm-alert sm-alert-error mb-3">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span th:text="${errorMessage}"></span>
        </div>


        <!-- Success message -->
        <div th:if="${successMessage}"
             class="sm-alert sm-alert-success mb-3">

            <i class="bi bi-check-circle me-2"></i>

            <span th:text="${successMessage}"></span>
        </div>


        <!-- Login form -->
        <form th:action="@{/login}" method="post">

            <div class="sm-form-group mb-3">

                <label for="identifier" class="sm-label">
                    Email or username
                </label>

                <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        class="sm-input"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                        autofocus>
            </div>


            <div class="sm-hint-box mb-4">
                <i class="bi bi-info-circle me-2"></i>
                You don't need a password to sign in.
            </div>


            <button type="submit" class="sm-btn-primary w-100">
                Sign in
                <i class="bi bi-arrow-right ms-1"></i>
            </button>

        </form>


        <!-- Register -->
        <p class="auth-switch text-center mt-4 mb-0">
            Don't have an account?
            <a th:href="@{/register}">
                Create one
            </a>
        </p>


        <!-- Demo accounts -->
        <div class="demo-box mt-4">

            <p class="demo-title mb-2">
                Demo accounts
            </p>

            <p class="text-muted small mb-3">
                Use one of these usernames to try the application.
            </p>

            <div class="demo-accounts">

                <button
                        type="button"
                        class="demo-btn"
                        onclick="fillLogin('alice_j')">
                    alice_j
                </button>

                <button
                        type="button"
                        class="demo-btn"
                        onclick="fillLogin('bobsmith')">
                    bobsmith
                </button>

                <button
                        type="button"
                        class="demo-btn"
                        onclick="fillLogin('priya_s')">
                    priya_s
                </button>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function fillLogin(username) {
        const input = document.querySelector('input[name="identifier"]');

        if (input) {
            input.value = username;
            input.focus();
        }
    }
</script>

</body>
</html>
