<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In - StreakMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <!-- Brand -->
        <div class="text-center mb-4">
            <a href="/" class="sm-brand text-decoration-none">
                <span class="sm-brand-name">StreakMate</span>
            </a>

            <p class="mt-2 mb-0 text-muted">
                Track your habits and keep your streak going.
            </p>
        </div>


        <!-- Login heading -->
        <div class="mb-4">
            <h1 class="auth-title">Welcome back</h1>
            <p class="auth-subtitle">
                Sign in using your email or username.
            </p>
        </div>


        <!-- Error message -->
        <div th:if="${errorMessage}"
             class="sm-alert sm-alert-error mb-3">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span th:text="${errorMessage}"></span>
        </div>

        <div th:if="${param.error}" class="sm-alert sm-alert-error mb-3">
            <i class="bi bi-exclamation-circle me-2"></i>
            <span>Invalid username/email or password.</span>
        </div>

        <!-- Success message -->
        <div th:if="${successMessage}"
             class="sm-alert sm-alert-success mb-3">

            <i class="bi bi-check-circle me-2"></i>

            <span th:text="${successMessage}"></span>
        </div>


        <!-- Login form -->
        <form th:action="@{/login}" method="post">

            <div class="sm-form-group mb-3">

                <label for="identifier" class="sm-label">
                    Email or username
                </label>

                <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        class="sm-input"
                        placeholder="Enter your email or username"
                        autocomplete="username"
                        required
                        autofocus>
            </div>


            <div class="sm-form-group mb-4">

                <label for="password" class="sm-label">Password</label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        class="sm-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
            </div>

            <button type="submit" class="sm-btn-primary w-100">
                Sign in
                <i class="bi bi-arrow-right ms-1"></i>
            </button>

        </form>


        <!-- Register -->
        <p class="auth-switch text-center mt-4 mb-0">
            Don't have an account?
            <a th:href="@{/register}">
                Create one
            </a>
        </p>



    </div>

</div>
</body>
</html>
