<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - StreakMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <!-- Brand -->
        <div class="text-center mb-4">

            <a href="/" class="sm-brand text-decoration-none">
                <span class="sm-brand-name">StreakMate</span>
            </a>

            <p class="mt-2 mb-0 text-muted">
                Start tracking your habits and challenges.
            </p>

        </div>


        <!-- Heading -->
        <div class="mb-4">

            <h1 class="auth-title">
                Create your account
            </h1>

            <p class="auth-subtitle">
                Enter your details to get started.
            </p>

        </div>


        <!-- Error message -->
        <div th:if="${errorMessage}"
             class="sm-alert sm-alert-error mb-4">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span th:text="${errorMessage}"></span>

        </div>


        <!-- Registration form -->
        <form th:action="@{/register}"
              method="post"
              th:object="${userDto}"
              novalidate>

            <!-- Full name -->
            <div class="sm-form-group mb-3">

                <label for="name" class="sm-label">
                    Full name
                </label>

                <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        class="sm-input"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                        placeholder="Enter your full name"
                        autocomplete="name">

                <div
                        class="sm-field-error"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                </div>

            </div>


            <!-- Email -->
            <div class="sm-form-group mb-3">

                <label for="email" class="sm-label">
                    Email address
                </label>

                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        class="sm-input"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                        placeholder="Enter your email"
                        autocomplete="email">

                <div
                        class="sm-field-error"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                </div>

            </div>


            <!-- Username -->
            <div class="sm-form-group mb-4">

                <label for="username" class="sm-label">
                    Username
                </label>

                <div class="sm-input-prefix-wrap">

                    <span class="sm-input-prefix">
                        @
                    </span>

                    <input
                            type="text"
                            id="username"
                            th:field="*{username}"
                            class="sm-input sm-input-prefixed"
                            th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                            placeholder="Enter a username"
                            autocomplete="username">

                </div>

                <div
                        class="sm-field-error"
                        th:if="${#fields.hasErrors('username')}"
                        th:errors="*{username}">
                </div>

            </div>


            <!-- Submit -->
            <button
                    type="submit"
                    class="sm-btn-primary w-100">

                Create account

                <i class="bi bi-arrow-right ms-1"></i>

            </button>

        </form>


        <!-- Login link -->
        <p class="auth-switch text-center mt-4 mb-0">

            Already have an account?

            <a th:href="@{/login}">
                Sign in
            </a>

        </p>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
