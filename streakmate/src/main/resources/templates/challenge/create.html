<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Challenge - StreakMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="app-page">

<!-- Navigation -->
<div th:replace="~{fragments/layout :: navbar}"
     th:with="activePage='create'">
</div>


<main class="app-main">

    <div class="container py-5" style="max-width: 640px;">

        <!-- Page heading -->
        <div class="page-header mb-4">

            <a th:href="@{/dashboard}" class="back-link">
                <i class="bi bi-arrow-left me-1"></i>
                Back to dashboard
            </a>

            <h1 class="page-title mt-3 mb-1">
                Create a Challenge
            </h1>

            <p class="page-sub">
                Set a goal and choose how long you want the challenge to run.
            </p>

        </div>


        <!-- Error message -->
        <div th:if="${errorMessage}"
             class="sm-alert sm-alert-error mb-4">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span th:text="${errorMessage}"></span>

        </div>


        <!-- Form -->
        <div class="form-card">

            <form th:action="@{/challenges/create}"
                  method="post"
                  th:object="${challengeDto}"
                  novalidate>


                <!-- Title -->
                <div class="sm-form-group mb-4">

                    <label for="title" class="sm-label">
                        Challenge title
                        <span class="sm-required">*</span>
                    </label>

                    <input
                            type="text"
                            id="title"
                            th:field="*{title}"
                            class="sm-input"
                            th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                            placeholder="Example: DSA 60-Day Challenge">

                    <div
                            class="sm-field-error"
                            th:if="${#fields.hasErrors('title')}"
                            th:errors="*{title}">
                    </div>

                    <div class="sm-field-hint">
                        Give your challenge a short, clear name.
                    </div>

                </div>


                <!-- Description -->
                <div class="sm-form-group mb-4">

                    <label for="description" class="sm-label">
                        Description
                    </label>

                    <textarea
                            id="description"
                            th:field="*{description}"
                            class="sm-input sm-textarea"
                            rows="4"
                            placeholder="What do you want participants to do each day?"></textarea>

                    <div
                            class="sm-field-error"
                            th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}">
                    </div>

                </div>


                <!-- Dates -->
                <div class="row g-3">

                    <!-- Start date -->
                    <div class="col-sm-6">

                        <div class="sm-form-group mb-0">

                            <label for="startDate" class="sm-label">
                                Start date
                                <span class="sm-required">*</span>
                            </label>

                            <input
                                    type="date"
                                    id="startDate"
                                    th:field="*{startDate}"
                                    class="sm-input"
                                    th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'"
                                    th:min="${#temporals.format(T(java.time.LocalDate).now(), 'yyyy-MM-dd')}">

                            <div
                                    class="sm-field-error"
                                    th:if="${#fields.hasErrors('startDate')}"
                                    th:errors="*{startDate}">
                            </div>

                        </div>

                    </div>


                    <!-- End date -->
                    <div class="col-sm-6">

                        <div class="sm-form-group mb-0">

                            <label for="endDate" class="sm-label">
                                End date
                                <span class="sm-required">*</span>
                            </label>

                            <input
                                    type="date"
                                    id="endDate"
                                    th:field="*{endDate}"
                                    class="sm-input"
                                    th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'">

                            <div
                                    class="sm-field-error"
                                    th:if="${#fields.hasErrors('endDate')}"
                                    th:errors="*{endDate}">
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Duration -->
                <div
                        class="duration-preview mt-3"
                        id="durationPreview"
                        style="display: none;">

                    <i class="bi bi-calendar-check me-2"></i>

                    <span id="durationText">
                        Select dates to see the challenge duration.
                    </span>

                </div>


                <!-- Submit -->
                <button
                        type="submit"
                        class="sm-btn-primary w-100 mt-4">

                    Create challenge

                    <i class="bi bi-arrow-right ms-1"></i>

                </button>

            </form>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>
    const titleInput = document.querySelector('input[name="title"]');
    const startInput = document.querySelector('input[name="startDate"]');
    const endInput = document.querySelector('input[name="endDate"]');

    const durationPreview = document.getElementById('durationPreview');
    const durationText = document.getElementById('durationText');


    function updateDuration() {

        const startValue = startInput.value;
        const endValue = endInput.value;

        if (!startValue || !endValue) {
            durationPreview.style.display = 'none';
            return;
        }

        const start = new Date(startValue + 'T00:00:00');
        const end = new Date(endValue + 'T00:00:00');

        const difference =
            Math.round((end - start) / (1000 * 60 * 60 * 24));

        if (difference < 0) {

            durationPreview.style.display = 'block';

            durationText.textContent =
                'End date must be after the start date.';

            return;
        }

        const days = difference + 1;

        durationPreview.style.display = 'block';

        if (days === 1) {
            durationText.textContent = '1 day · 1 check-in';
        } else {
            durationText.textContent =
                days + ' days · ' + days + ' check-ins';
        }
    }


    function updateEndDate() {

        if (startInput.value) {
            endInput.min = startInput.value;

            if (endInput.value && endInput.value < startInput.value) {
                endInput.value = startInput.value;
            }
        }

        updateDuration();
    }


    if (startInput && endInput) {

        startInput.addEventListener('change', updateEndDate);

        endInput.addEventListener('change', updateDuration);

        updateEndDate();
    }
</script>

</body>
</html>
