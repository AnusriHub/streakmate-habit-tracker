<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Challenge - StreakMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="app-page">

<div th:replace="~{fragments/layout :: navbar}"
     th:with="activePage='join'">
</div>

<main class="app-main">

    <div class="container py-5" style="max-width: 520px;">

        <!-- Page heading -->

        <div class="page-header mb-4">

            <a
                    th:href="@{/dashboard}"
                    class="back-link mb-3 d-inline-block">

                <i class="bi bi-arrow-left me-1"></i>
                Back to dashboard

            </a>

            <h1 class="page-title">
                Join a Challenge
            </h1>

            <p class="page-sub">
                Enter the code shared by the challenge creator.
            </p>

        </div>


        <!-- Messages -->

        <div
                th:if="${errorMessage}"
                class="sm-alert sm-alert-error mb-4">

            <i class="bi bi-exclamation-circle me-2"></i>

            <span th:text="${errorMessage}">
                Something went wrong.
            </span>

        </div>


        <div
                th:if="${successMessage}"
                class="sm-alert sm-alert-success mb-4">

            <i class="bi bi-check-circle me-2"></i>

            <span th:text="${successMessage}">
                Successfully joined.
            </span>

        </div>


        <!-- Join form -->

        <div class="form-card">

            <h2 class="join-title">
                Enter challenge code
            </h2>

            <p class="join-sub text-muted">
                Ask the challenge creator for the code.
            </p>


            <form
                    th:action="@{/challenges/join}"
                    method="post"
                    class="mt-4">

                <div class="sm-form-group mb-3">

                    <label
                            for="challengeCode"
                            class="sm-label">
                        Challenge code
                    </label>

                    <input
                            type="text"
                            id="challengeCode"
                            name="code"
                            class="sm-input code-input"
                            placeholder="Example: DSA60"
                            maxlength="20"
                            autocomplete="off"
                            required
                            autofocus>

                </div>


                <button
                        type="submit"
                        class="sm-btn-primary w-100">

                    <i class="bi bi-person-plus me-1"></i>
                    Join challenge

                </button>

            </form>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    const codeInput = document.getElementById('challengeCode');

    if (codeInput) {

        codeInput.addEventListener('input', function () {
            this.value = this.value.toUpperCase();
        });

    }

</script>

</body>
</html>
