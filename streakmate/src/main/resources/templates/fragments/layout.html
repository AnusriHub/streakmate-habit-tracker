<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle != null ? pageTitle + ' - StreakMate' : 'StreakMate'}">
        StreakMate
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="sm-navbar">

    <div class="container-fluid px-4">

        <div class="d-flex align-items-center justify-content-between py-3">

            <!-- Brand -->
            <a
                    th:href="@{/dashboard}"
                    class="sm-brand">

                <span class="sm-brand-name">
                    StreakMate
                </span>

            </a>

            <!-- Desktop navigation -->
            <div class="sm-nav-links d-none d-md-flex align-items-center gap-1">

                <a
                        th:href="@{/dashboard}"
                        class="sm-nav-link"
                        th:classappend="${activePage == 'dashboard'} ? 'active'">

                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    Dashboard

                </a>

                <a
                        th:href="@{/challenges/create}"
                        class="sm-nav-link"
                        th:classappend="${activePage == 'create'} ? 'active'">

                    <i class="bi bi-plus-circle-fill"></i>
                    New challenge

                </a>

                <a
                        th:href="@{/challenges/join}"
                        class="sm-nav-link"
                        th:classappend="${activePage == 'join'} ? 'active'">

                    <i class="bi bi-person-plus-fill"></i>
                    Join

                </a>

                <a
                        th:href="@{/challenges/history}"
                        class="sm-nav-link"
                        th:classappend="${activePage == 'history'} ? 'active'">

                    <i class="bi bi-clock-history"></i>
                    History

                </a>

                <a
                        th:href="@{/profile}"
                        class="sm-nav-link"
                        th:classappend="${activePage == 'profile'} ? 'active'">

                    <i class="bi bi-person-circle"></i>
                    Profile

                </a>

            </div>

            <!-- Right side -->
            <div class="d-flex align-items-center gap-3">

                <span
                        class="sm-username-badge d-none d-md-flex"
                        th:if="${session.sessionUsername != null}">

                    <i class="bi bi-person-fill"></i>

                    <span th:text="${session.sessionUsername}">
                        username
                    </span>

                </span>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="sm-btn-ghost">

                        <i class="bi bi-box-arrow-right"></i>

                        <span class="d-none d-md-inline">
            Sign out
        </span>

                    </button>
                </form>

                <!-- Mobile menu button -->
                <button
                        class="sm-mobile-toggle d-md-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mobileNav"
                        aria-controls="mobileNav"
                        aria-label="Toggle navigation">

                    <i class="bi bi-list"></i>

                </button>

            </div>

        </div>

        <!-- Mobile navigation -->
        <div
                class="collapse d-md-none"
                id="mobileNav">

            <div class="sm-mobile-nav pb-3">

                <a
                        th:href="@{/dashboard}"
                        class="sm-mobile-link">

                    <i class="bi bi-grid-3x3-gap-fill"></i>
                    Dashboard

                </a>

                <a
                        th:href="@{/challenges/create}"
                        class="sm-mobile-link">

                    <i class="bi bi-plus-circle-fill"></i>
                    New challenge

                </a>

                <a
                        th:href="@{/challenges/join}"
                        class="sm-mobile-link">

                    <i class="bi bi-person-plus-fill"></i>
                    Join challenge

                </a>

                <a
                        th:href="@{/challenges/history}"
                        class="sm-mobile-link">

                    <i class="bi bi-clock-history"></i>
                    History

                </a>

                <a
                        th:href="@{/profile}"
                        class="sm-mobile-link">

                    <i class="bi bi-person-circle"></i>
                    Profile

                </a>

            </div>

        </div>

    </div>

</nav>

</body>
</html>
