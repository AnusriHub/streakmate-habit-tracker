<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${user.name + ' - StreakMate'}">
        Profile - StreakMate
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="app-page">

<div th:replace="~{fragments/layout :: navbar}"
     th:with="activePage='profile'">
</div>

<main class="app-main">

    <div class="container-xl px-4 py-5">

        <!-- Profile information -->
        <div class="profile-hero mb-5">

            <div
                    class="profile-avatar-lg"
                    th:text="${user.name.substring(0,1).toUpperCase()}">
                A
            </div>

            <div class="profile-info">

                <h1
                        class="profile-name"
                        th:text="${user.name}">
                    Name
                </h1>

                <p class="profile-username">
                    @<span th:text="${user.username}">
                        username
                    </span>
                </p>

                <p class="profile-since">

                    <i class="bi bi-calendar3 me-1"></i>

                    Member since
                    <span
                            th:text="${#temporals.format(
                                user.createdAt,
                                'MMMM yyyy'
                            )}">
                        January 2025
                    </span>

                </p>

            </div>

        </div>

        <!-- Statistics -->
        <div class="stats-grid mb-5">

            <div class="stat-card stat-card-streak">

                <div
                        class="stat-number"
                        th:text="${currentStreak}">
                    0
                </div>

                <div class="stat-label">
                    Current streak
                </div>

            </div>

            <div class="stat-card stat-card-trophy">

                <div
                        class="stat-number"
                        th:text="${longestStreak}">
                    0
                </div>

                <div class="stat-label">
                    Longest streak
                </div>

            </div>

            <div class="stat-card stat-card-checkin">

                <div
                        class="stat-number"
                        th:text="${totalCheckIns}">
                    0
                </div>

                <div class="stat-label">
                    Total check-ins
                </div>

            </div>

            <div class="stat-card stat-card-percent">

                <div
                        class="stat-number"
                        th:text="${totalChallenges}">
                    0
                </div>

                <div class="stat-label">
                    Challenges joined
                </div>

            </div>

        </div>

        <div class="row g-4">

            <!-- Badges -->
            <div class="col-lg-4">

                <div class="side-card h-100">

                    <h2 class="section-title mb-4">
                        Badges
                    </h2>

                    <div
                            th:if="${badges.isEmpty()}"
                            class="empty-state-sm">

                        <p class="text-muted mb-0">
                            Complete check-ins to earn badges.
                        </p>

                    </div>

                    <div
                            class="badges-list"
                            th:unless="${badges.isEmpty()}">

                        <div
                                th:each="ub : ${badges}"
                                class="badge-item">

                            <div
                                    class="badge-item-icon"
                                    th:text="${ub.badge.icon}">
                                🏆
                            </div>

                            <div class="badge-item-body">

                                <div
                                        class="badge-item-name"
                                        th:text="${ub.badge.badgeName}">
                                    Badge
                                </div>

                                <div
                                        class="badge-item-desc"
                                        th:text="${ub.badge.description}">
                                    Description
                                </div>

                                <div class="badge-item-date text-muted small">

                                    Earned
                                    <span
                                            th:text="${#temporals.format(
                                                ub.earnedAt,
                                                'MMM d, yyyy'
                                            )}">
                                        Date
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Challenges -->
            <div class="col-lg-8">

                <div class="side-card">

                    <h2 class="section-title mb-4">
                        Challenges
                    </h2>

                    <div
                            th:if="${participations.isEmpty()}"
                            class="empty-state-sm text-center py-4">

                        <p class="text-muted">
                            No challenges yet.
                        </p>

                        <a
                                th:href="@{/challenges/create}"
                                class="sm-btn-primary mt-2">

                            Create challenge

                        </a>

                    </div>

                    <div th:unless="${participations.isEmpty()}">

                        <div
                                th:each="p : ${participations}"
                                class="profile-challenge-row">

                            <div class="pcr-left">

                                <span
                                        class="pcr-code"
                                        th:text="${p.challenge.challengeCode}">
                                    CODE
                                </span>

                                <div>

                                    <div
                                            class="pcr-title"
                                            th:text="${p.challenge.title}">
                                        Title
                                    </div>

                                    <div class="pcr-meta">

                                        <span th:text="${p.checkIns.size()}">
                                            0
                                        </span>

                                        /

                                        <span th:text="${p.challenge.totalDays}">
                                            30
                                        </span>

                                        days ·

                                        <span
                                                th:text="${#temporals.format(
                                                    p.challenge.endDate,
                                                    'MMM d, yyyy'
                                                )}">
                                            Date
                                        </span>

                                    </div>

                                </div>

                            </div>

                            <div class="pcr-right">

                                <div
                                        class="progress sm-progress"
                                        style="width: 100px; height: 6px;">

                                    <div
                                            class="progress-bar"
                                            th:style="'width: ' + ${#numbers.formatDecimal(
                                                (p.checkIns.size().doubleValue()
                                                / p.challenge.totalDays) * 100,
                                                1,
                                                0
                                            )} + '%'">
                                    </div>

                                </div>

                                <span
                                        class="status-badge"
                                        th:classappend="${p.challenge.status.name() == 'ACTIVE'}
                                            ? 'status-active'
                                            : 'status-expired'"
                                        th:text="${p.challenge.status}">
                                    ACTIVE
                                </span>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
