<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Challenge History - StreakMate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <link th:href="@{/css/main.css}" rel="stylesheet">
</head>

<body class="app-page">

<div th:replace="~{fragments/layout :: navbar}"
     th:with="activePage='history'">
</div>

<main class="app-main">

    <div class="container-xl px-4 py-5">

        <!-- Page heading -->

        <div class="page-header mb-4">

            <h1 class="page-title">
                Challenge History
            </h1>

            <p class="page-sub">
                Challenges you have created or joined.
            </p>

        </div>


        <!-- Empty state -->

        <div
                th:if="${participations.isEmpty()}"
                class="empty-state">

            <h3>
                No challenges yet
            </h3>

            <p>
                Create or join a challenge to see it here.
            </p>

            <div class="d-flex gap-3 justify-content-center mt-3">

                <a
                        th:href="@{/challenges/create}"
                        class="sm-btn-primary">

                    Create challenge

                </a>

                <a
                        th:href="@{/challenges/join}"
                        class="sm-btn-ghost">

                    Join with code

                </a>

            </div>

        </div>


        <!-- Challenge list -->

        <div
                class="row g-4"
                th:unless="${participations.isEmpty()}">

            <div
                    th:each="participation : ${participations}"
                    class="col-md-6 col-lg-4">

                <div
                        class="history-card"
                        th:classappend="${participation.challenge.status.name() == 'ACTIVE'}
                            ? 'hc-active'
                            : (${participation.challenge.status.name() == 'EXPIRED'}
                                ? 'hc-expired'
                                : 'hc-completed')">


                    <!-- Card top -->

                    <div class="hc-top">

                        <div
                                class="hc-code"
                                th:text="${participation.challenge.challengeCode}">
                            CODE
                        </div>

                        <span
                                class="status-badge"
                                th:classappend="${participation.challenge.status.name() == 'ACTIVE'}
                                    ? 'status-active'
                                    : (${participation.challenge.status.name() == 'EXPIRED'}
                                        ? 'status-expired'
                                        : 'status-completed')"
                                th:text="${participation.challenge.status}">
                            ACTIVE
                        </span>

                    </div>


                    <!-- Challenge title -->

                    <h3
                            class="hc-title"
                            th:text="${participation.challenge.title}">
                        Challenge title
                    </h3>


                    <!-- Dates -->

                    <div class="hc-dates">

                        <i class="bi bi-calendar3 me-1"></i>

                        <span
                                th:text="${#temporals.format(participation.challenge.startDate, 'MMM d')}">
                            Jan 1
                        </span>

                        -

                        <span
                                th:text="${#temporals.format(participation.challenge.endDate, 'MMM d, yyyy')}">
                            Feb 1, 2025
                        </span>

                    </div>


                    <!-- Progress -->

                    <div class="hc-progress-wrap">

                        <div class="d-flex justify-content-between mb-1">

                            <span class="small text-muted">

                                <span th:text="${participation.checkIns.size()}">
                                    0
                                </span>

                                /

                                <span th:text="${participation.challenge.totalDays}">
                                    30
                                </span>

                                days

                            </span>


                            <span
                                    class="small fw-600"
                                    th:text="${#numbers.formatDecimal(
                                        (participation.checkIns.size().doubleValue()
                                        / participation.challenge.totalDays) * 100,
                                        1, 0)} + '%'">

                                0%

                            </span>

                        </div>


                        <div class="progress sm-progress">

                            <div
                                    class="progress-bar"
                                    th:classappend="${participation.challenge.status.name() == 'EXPIRED'}
                                        ? 'bg-secondary'
                                        : ''"
                                    th:style="'width: ' + ${#numbers.formatDecimal(
                                        (participation.checkIns.size().doubleValue()
                                        / participation.challenge.totalDays) * 100,
                                        1, 0)} + '%'">
                            </div>

                        </div>

                    </div>


                    <!-- Card footer -->

                    <div class="hc-footer">

                        <a
                                th:href="@{/challenges/{id}(id=${participation.challenge.id})}"
                                class="sm-link">

                            View details

                            <i class="bi bi-arrow-right ms-1"></i>

                        </a>


                        <span class="hc-joined">

                            Joined

                            <span
                                    th:text="${#temporals.format(
                                        participation.joinedAt,
                                        'MMM d')}">
                                Jan 1
                            </span>

                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
